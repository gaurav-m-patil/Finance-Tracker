<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Financial Command Center</h2>
    
    <!-- Tab Navigation -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="entry-tab" data-bs-toggle="tab" data-bs-target="#entry" type="button" role="tab">Data Entry</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="insights-tab" data-bs-toggle="tab" data-bs-target="#insights" type="button" role="tab">Insights</button>
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content mt-4" id="myTabContent">
      
      <!-- Tab 1: Data Entry -->
      <div class="tab-pane fade show active" id="entry" role="tabpanel">
        <form id="salaryForm" onsubmit="submitForm(event)">
          <div class="row g-3">
            <div class="col-md-4"><label>Month & Year</label><input type="text" class="form-control" name="monthYear" required></div>
            <div class="col-md-4"><label>Total Earnings</label><input type="number" class="form-control" name="totalEarnings" required></div>
            <div class="col-md-4"><label>Total Deductions</label><input type="number" class="form-control" name="totalDeductions" required></div>
            <div class="col-md-4"><label>Employee PF</label><input type="number" class="form-control" name="employeePF"></div>
            <div class="col-md-4"><label>Tax Deduction</label><input type="number" class="form-control" name="taxDeduction"></div>
            <div class="col-md-4"><label>Gratuity</label><input type="number" class="form-control" name="gratuity"></div>
            <!-- Add remaining input fields here following the same div structure -->
          </div>
          <button type="submit" class="btn btn-primary mt-4">Save to Sheet</button>
        </form>
      </div>

      <!-- Tab 2: Insights -->
      <div class="tab-pane fade" id="insights" role="tabpanel">
        <h4>Dashboard</h4>
        <p>Your calculated net worth, PF compounding, and liquid cash will render here.</p>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function submitForm(event) {
      event.preventDefault();
      const form = document.getElementById('salaryForm');
      const formData = Object.fromEntries(new FormData(form).entries());
      
      google.script.run.withSuccessHandler(() => {
        alert("Saved successfully!");
        form.reset();
      }).saveSalaryData(formData);
    }
  </script>
</body>
</html>

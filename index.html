<!DOCTYPE html>
<html>
<head>
    <title>Financial Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container bg-white p-4 rounded shadow-sm max-w-lg">
        <h3 class="mb-4">Log Salary Details</h3>
        <form id="salaryForm">
            <!-- Example of the first row of inputs -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label>Month & Year</label>
                    <input type="text" class="form-control" id="monthYear" placeholder="e.g. Oct 2026" required>
                </div>
                <div class="col-md-6">
                    <label>Total Earnings</label>
                    <input type="number" class="form-control" id="totalEarnings" required>
                </div>
            </div>
            
            <!-- You will add the other 10 inputs following the same structure here -->
            
            <button type="submit" class="btn btn-primary w-100 mt-3" id="submitBtn">Submit to Sheet</button>
        </form>
    </div>

    <script>
        // Paste your Apps Script Web App URL here
        const API_URL = "https://script.google.com/macros/s/AKfycbxw50bYSCs1TSMYGm5HaOsc-y0jf2mAtE8l56_2NhYgI4HxQmtRQhP-9O4cKLC3vYxgsw/exec";

        document.getElementById("salaryForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Submitting...";

            // Gather data from inputs
            const payload = {
                monthYear: document.getElementById("monthYear").value,
                totalEarnings: document.getElementById("totalEarnings").value,
                // Add the rest of your input values here matching the exact keys in the Apps Script
            };

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                alert("Salary Logged Successfully!");
                document.getElementById("salaryForm").reset();
                btn.innerText = "Submit to Sheet";
            })
            .catch(error => {
                alert("Error saving data.");
                btn.innerText = "Submit to Sheet";
            });
        });
    </script>
</body>
</html>
